name: Build SafariJS Dopamine Rootless

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
          libgcuniversal: 'false'
          altlist: 'false'

      - name: Fix package script permissions
        run: |
          set -e

          echo "===== BEFORE ====="
          find layout -maxdepth 3 -type f -print -exec ls -l {} \; 2>/dev/null || true

          if [ -f layout/DEBIAN/postinst ]; then
            chmod 755 layout/DEBIAN/postinst
          fi

          if [ -f layout/DEBIAN/preinst ]; then
            chmod 755 layout/DEBIAN/preinst
          fi

          if [ -f layout/DEBIAN/prerm ]; then
            chmod 755 layout/DEBIAN/prerm
          fi

          if [ -f layout/DEBIAN/postrm ]; then
            chmod 755 layout/DEBIAN/postrm
          fi

          echo "===== AFTER ====="
          find layout -maxdepth 3 -type f -print -exec ls -l {} \; 2>/dev/null || true

      - name: Validate project
        run: |
          set -e

          test -f Makefile
          test -f control
          test -f safarijs.m
          test -f entitlements.plist

          plutil -lint entitlements.plist

          if grep -nE '^[[:space:]]*safarijs_LIBRARIES[[:space:]]*=[[:space:]]*xpc' Makefile; then
            echo "ERROR: Remove safarijs_LIBRARIES = xpc"
            exit 1
          fi

      - name: Build SafariJS
        run: |
          set -e

          echo "THEOS=$THEOS"

          rm -rf .theos packages

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            THEOS_PACKAGE_ARCH=iphoneos-arm64

      - name: Verify package
        run: |
          set -e

          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | head -1)"

          if [ -z "$DEB" ]; then
            echo "ERROR: DEB NOT CREATED"
            exit 1
          fi

          echo "DEB=$DEB"

          dpkg-deb -f "$DEB" \
            Package \
            Version \
            Architecture \
            Depends

          ARCH="$(dpkg-deb -f "$DEB" Architecture)"

          if [ "$ARCH" != "iphoneos-arm64" ]; then
            echo "ERROR: wrong architecture: $ARCH"
            exit 1
          fi

          echo "===== CONTENTS ====="
          dpkg-deb -c "$DEB"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SafariJS-Dopamine-rootless
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 7
